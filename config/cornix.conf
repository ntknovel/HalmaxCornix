# Cornix BASIC 260817 wireless profile.
# Shared by the left and right halves.

# Maximum nRF52840 BLE transmit power on both halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Prefer BLE 1M PHY for range and host compatibility.
CONFIG_BT_CTLR_PHY_2M=n

# Report battery state every 5 minutes.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# Required for the mouse layer and middle-button encoder clicks.
CONFIG_ZMK_POINTING=y

# Distinguish this clean basic build from the stock RMK pairing entry.
CONFIG_ZMK_KEYBOARD_NAME="Cornix 260817"

# Keep optional visual features off for battery life.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n

# Runtime per-connection BLE TX controls: 0 / +4 / +8 dBm.
CONFIG_BT_HCI_VS=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
