# CCK-BALL right half: split central, host BLE/USB, PMW3610 trackball.

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y

# CCK-BALL hardware-specific orientation and feel retained.
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_270=y
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=70
CONFIG_PMW3610_INVERT_X=y

CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_SMART_ALGORITHM=y

# Safe Keyball-style sensor timing settings supported by the current
# DoctorWangWang PMW3610 driver.
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700

# Not available in the current CCK-BALL driver, therefore intentionally absent:
# CONFIG_PMW3610_PM
# CONFIG_PMW3610_MOVEMENT_THRESHOLD

# CCK v1.1.1: RIGHT is host central; standard USB and BLE Studio RPC.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_CCK_WHEEL_REMAP=y
CONFIG_CCK_USB_AUTO_SELECT=y
CONFIG_CORNIX_STENO=y
CONFIG_CORNIX_STENO_DICTIONARY=y
CONFIG_CORNIX_STENO_MAX_POSITIONS=64
CONFIG_CORNIX_STENO_KEYUP_CORRECTION_MS=0
CONFIG_CORNIX_STENO_FINAL_ROLL_MS=90
CONFIG_CORNIX_STENO_SOLO_CORRECTION_MS=500
CONFIG_CORNIX_STENO_LED=n
CONFIG_CORNIX_STENO_OUTPUT_QUEUE_SIZE=256
CONFIG_CORNIX_STENO_OUTPUT_HOLD_MS=4
CONFIG_CORNIX_STENO_OUTPUT_GAP_MS=4

# v1.1.1: EO+ball scrolling and EO+mouse-key gestures, central only.
CONFIG_CCK_STENO_POINTER_ASSIST=y
