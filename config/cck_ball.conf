# =============================================================================
# CCK-BALL — Keyball-derived BLE stability profile
# This file is shared by both halves.
# =============================================================================

# Host BLE connection preference.
# BLE interval units are 1.25 ms; timeout units are 10 ms.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Keyball 61-style Bluetooth transport buffers.
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Maximum nRF52840 controller transmit power.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK v0.3 stability profile. In this ZMK branch this makes 1M PHY the default
# by disabling 2M PHY.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Keyball 61 uses a large complex-behavior queue.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Report the peripheral half's battery level through the central half.

# Existing CCK-BALL settings retained.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_POINTING=y


# Deliberately not enabled in the stability build:
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
#
# The public Keyball 61 profile enables deep sleep, but CCK-BALL uses a
# different PMW3610 driver without Keyball's PMW3610_PM support. Enabling
# deep sleep here could look like another disconnect or prevent trackball-only
# wake-up, so it is kept as an explicit optional experiment.

# STENO and Studio run on RIGHT only (per-shield configuration).
